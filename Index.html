<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#000;
    color:#fff;
    min-height:100vh;
}

.screen{
    min-height:100vh;
    width:100%;
    max-width:520px;
    margin:auto;
    padding:25px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}

.hidden{
    display:none!important;
}

/* HOME */

.logo{
    font-size:45px;
    font-weight:900;
    letter-spacing:4px;
    text-align:center;
    margin-bottom:45px;
}

.menu{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:15px;
}

button{
    color:#fff;
    background:#111;
    border:1px solid #333;
    border-radius:13px;
    padding:17px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1b1b1b;
}

/* DIFFICULTY */

.difficultyTitle{
    font-size:26px;
    font-weight:900;
    margin-bottom:30px;
    letter-spacing:1px;
}

.difficultyMenu{
    width:100%;
    display:flex;
    flex-direction:column;
    gap:15px;
}

/* GAME */

.topbar{
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.smallBtn{
    padding:10px 14px;
    font-size:13px;
}

.title{
    font-size:23px;
    font-weight:900;
    letter-spacing:2px;
}

.mode{
    color:#888;
    font-size:14px;
    margin-bottom:20px;
}

.scoreboard{
    width:100%;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:25px;
}

.score{
    background:#0c0c0c;
    border:1px solid #222;
    border-radius:12px;
    padding:14px;
    text-align:center;
}

.score span{
    display:block;
    color:#777;
    font-size:12px;
    margin-bottom:6px;
}

.score strong{
    font-size:22px;
}

/* EXACTLY 9 BOXES */

.board{
    width:min(90vw,390px);
    aspect-ratio:1;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    gap:10px;
}

.cell{
    background:#0b0b0b;
    border:1px solid #292929;
    border-radius:16px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:58px;
    font-weight:900;
    cursor:pointer;
    user-select:none;
}

.cell:hover{
    background:#151515;
}

/* X = NO ANIMATION */

.cell.x{
    color:#fff;
}

/* ONLY COMPUTER O ANIMATION */

.cell.o{
    color:#aaa;
    animation:oAppear .55s cubic-bezier(.2,.8,.2,1);
}

@keyframes oAppear{
    0%{
        transform:scale(0);
        opacity:0;
    }

    60%{
        transform:scale(1.2);
        opacity:1;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}

.turn{
    margin-top:20px;
    color:#aaa;
    font-size:15px;
}

.controls{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.controls button{
    padding:11px 15px;
    font-size:13px;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.88);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.modalBox{
    width:100%;
    max-width:420px;
    background:#0b0b0b;
    border:1px solid #292929;
    border-radius:18px;
    padding:28px;
}

.modalBox h2{
    margin-bottom:18px;
}

.modalBox p{
    color:#aaa;
    line-height:1.6;
    margin-bottom:22px;
}

.got{
    width:100%;
    background:#fff;
    color:#000;
}
</style>
</head>

<body>

<!-- HOME -->

<div id="homeScreen" class="screen">

    <div class="logo">TIC TAC TOE</div>

    <div class="menu">

        <button onclick="startPVP()">
            PLAY — 2 PLAYERS
        </button>

        <button onclick="showDifficulty()">
            PLAY VS COMPUTER
        </button>

        <button onclick="openModal()">
            HOW TO PLAY
        </button>

    </div>

</div>


<!-- DIFFICULTY -->

<div id="difficultyScreen" class="screen hidden">

    <div class="difficultyTitle">
        COMPUTER MODE
    </div>

    <div class="difficultyMenu">

        <button onclick="startComputer('easy')">
            EASY MODE
        </button>

        <button onclick="startComputer('normal')">
            NORMAL MODE
        </button>

        <button onclick="startComputer('hard')">
            HARD MODE
        </button>

        <button onclick="backHome()">
            BACK
        </button>

    </div>

</div>


<!-- GAME -->

<div id="gameScreen" class="screen hidden">

    <div class="topbar">

        <button class="smallBtn" onclick="goHome()">
            HOME
        </button>

        <div class="title">
            TIC TAC TOE
        </div>

        <button class="smallBtn" onclick="openModal()">
            ?
        </button>

    </div>

    <div id="modeText" class="mode"></div>

    <div class="scoreboard">

        <div class="score">
            <span>X</span>
            <strong id="xScore">0</strong>
        </div>

        <div class="score">
            <span>DRAWS</span>
            <strong id="drawScore">0</strong>
        </div>

        <div class="score">
            <span>O</span>
            <strong id="oScore">0</strong>
        </div>

    </div>


    <!-- 9 BOXES -->

    <div class="board">

        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>

        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>

        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>

    </div>

    <div id="turnText" class="turn">
        X's Turn
    </div>

    <div class="controls">

        <button onclick="newGame()">
            NEW GAME
        </button>

        <button onclick="resetScores()">
            RESET SCORE
        </button>

    </div>

</div>


<!-- HOW TO PLAY -->

<div id="modal" class="modal hidden">

    <div class="modalBox">

        <h2>How To Play</h2>

        <p>
            Get three of your symbols in a row,
            column, or diagonal before your opponent.
            X always starts first.
        </p>

        <button id="gotItBtn" class="got">
            GOT IT
        </button>

    </div>

</div>


<script>

let board = [
    "","","",
    "","","",
    "","",""
];

let currentPlayer = "X";
let gameOver = false;

let gameMode = "pvp";
let difficulty = "easy";

let xScore = 0;
let oScore = 0;
let drawScore = 0;

const cells = document.querySelectorAll(".cell");

const winningPatterns = [

    [0,1,2],
    [3,4,5],
    [6,7,8],

    [0,3,6],
    [1,4,7],
    [2,5,8],

    [0,4,8],
    [2,4,6]

];


/* PVP */

function startPVP(){

    gameMode = "pvp";

    document.getElementById("homeScreen")
        .classList.add("hidden");

    document.getElementById("gameScreen")
        .classList.remove("hidden");

    document.getElementById("modeText").textContent =
        "2 PLAYERS";

    newGame();
}


/* SHOW DIFFICULTY */

function showDifficulty(){

    document.getElementById("homeScreen")
        .classList.add("hidden");

    document.getElementById("difficultyScreen")
        .classList.remove("hidden");
}


/* START COMPUTER */

function startComputer(level){

    gameMode = "computer";
    difficulty = level;

    document.getElementById("difficultyScreen")
        .classList.add("hidden");

    document.getElementById("gameScreen")
        .classList.remove("hidden");

    document.getElementById("modeText").textContent =
        level.toUpperCase() + " MODE";

    newGame();
}


/* BACK */

function backHome(){

    document.getElementById("difficultyScreen")
        .classList.add("hidden");

    document.getElementById("homeScreen")
        .classList.remove("hidden");
}


/* NEW GAME */

function newGame(){

    board = [
        "","","",
        "","","",
        "","",""
    ];

    currentPlayer = "X";
    gameOver = false;

    cells.forEach(cell => {

        cell.textContent = "";
        cell.className = "cell";

    });

    document.getElementById("turnText").textContent =
        "X's Turn";
}


/* CELL CLICK */

cells.forEach(cell => {

    cell.addEventListener("click", function(){

        const index = Number(this.dataset.index);

        if(gameOver) return;

        if(board[index] !== "") return;

        if(
            gameMode === "computer" &&
            currentPlayer === "O"
        ){
            return;
        }

        playerMove(index);

    });

});


/* PLAYER MOVE */

function playerMove(index){

    board[index] = "X";

    /* X appears instantly */

    cells[index].textContent = "X";
    cells[index].className = "cell x";

    if(checkGame("X")) return;

    currentPlayer = "O";

    document.getElementById("turnText").textContent =
        gameMode === "computer"
        ? "Computer's Turn"
        : "O's Turn";

    if(gameMode === "computer"){

        setTimeout(() => {

            computerMove();

        },650);

    }

}


/* COMPUTER MOVE */

function computerMove(){

    if(gameOver) return;

    let move;

    if(difficulty === "easy"){

        move = easyMove();

    }

    else if(difficulty === "normal"){

        move = normalMove();

    }

    else{

        move = hardMove();

    }

    if(move === null || move === undefined){
        return;
    }

    board[move] = "O";

    /*
       ONLY COMPUTER O GETS
       THE ANIMATION
    */

    cells[move].textContent = "O";
    cells[move].className = "cell o";

    if(checkGame("O")) return;

    currentPlayer = "X";

    document.getElementById("turnText").textContent =
        "X's Turn";
}


/* EASY */

function easyMove(){

    let available = getAvailable();

    if(available.length === 0){
        return null;
    }

    return available[
        Math.floor(Math.random() * available.length)
    ];
}


/* NORMAL */

function normalMove(){

    let available = getAvailable();

    if(available.length === 0){
        return null;
    }

    /* Try to win */

    let win = findWinningMove("O");

    if(win !== null){
        return win;
    }

    /* Sometimes block player */

    if(Math.random() < 0.65){

        let block = findWinningMove("X");

        if(block !== null){
            return block;
        }

    }

    /* Prefer center */

    if(board[4] === "" && Math.random() < 0.7){
        return 4;
    }

    return available[
        Math.floor(Math.random() * available.length)
    ];
}


/* HARD */

function hardMove(){

    let bestScore = -Infinity;
    let move = null;

    for(let i=0;i<9;i++){

        if(board[i] === ""){

            board[i] = "O";

            let score = minimax(board,false);

            board[i] = "";

            if(score > bestScore){

                bestScore = score;
                move = i;

            }

        }

    }

    return move;
}


/* MINIMAX */

function minimax(state,isMaximizing){

    if(hasWinner(state,"O")){
        return 10;
    }

    if(hasWinner(state,"X")){
        return -10;
    }

    if(state.every(v => v !== "")){
        return 0;
    }

    if(isMaximizing){

        let best = -Infinity;

        for(let i=0;i<9;i++){

            if(state[i] === ""){

                state[i] = "O";

                let score =
                    minimax(state,false);

                state[i] = "";

                best = Math.max(best,score);

            }

        }

        return best;

    }

    else{

        let best = Infinity;

        for(let i=0;i<9;i++){

            if(state[i] === ""){

                state[i] = "X";

                let score =
                    minimax(state,true);

                state[i] = "";

                best = Math.min(best,score);

            }

        }

        return best;
    }
}


/* AVAILABLE */

function getAvailable(){

    let result = [];

    for(let i=0;i<9;i++){

        if(board[i] === ""){
            result.push(i);
        }

    }

    return result;
}


/* FIND WINNING MOVE */

function findWinningMove(player){

    for(let i=0;i<9;i++){

        if(board[i] === ""){

            board[i] = player;

            let won = hasWinner(board,player);

            board[i] = "";

            if(won){
                return i;
            }

        }

    }

    return null;
}


/* CHECK */

function checkGame(player){

    if(hasWinner(board,player)){

        gameOver = true;

        if(player === "X"){
            xScore++;
        }else{
            oScore++;
        }

        updateScores();

        document.getElementById("turnText").textContent =
            player + " WINS!";

        return true;
    }

    if(board.every(v => v !== "")){

        gameOver = true;

        drawScore++;

        updateScores();

        document.getElementById("turnText").textContent =
            "DRAW!";

        return true;
    }

    return false;
}


/* WINNER */

function hasWinner(state,player){

    return winningPatterns.some(pattern => {

        return pattern.every(index =>
            state[index] === player
        );

    });

}


/* SCORES */

function updateScores(){

    document.getElementById("xScore").textContent =
        xScore;

    document.getElementById("oScore").textContent =
        oScore;

    document.getElementById("drawScore").textContent =
        drawScore;
}


/* RESET */

function resetScores(){

    xScore = 0;
    oScore = 0;
    drawScore = 0;

    updateScores();

    newGame();
}


/* HOME */

function goHome(){

    document.getElementById("gameScreen")
        .classList.add("hidden");

    document.getElementById("homeScreen")
        .classList.remove("hidden");
}


/* MODAL */

function openModal(){

    document.getElementById("modal")
        .classList.remove("hidden");
}


function closeModal(){

    document.getElementById("modal")
        .classList.add("hidden");
}


document.getElementById("gotItBtn")
    .addEventListener("click",closeModal);

</script>

</body>
</html>
